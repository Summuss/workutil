[project]
name = "workutil"
version = "0.5.0"
description = "Local developer productivity tool"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "platformdirs>=4.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
workutil = "app.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Alembic writes these; they are a historical record, not hand-maintained code.
exclude = ["app/migrations/versions/*"]

[tool.ruff.lint.per-file-ignores]
"app/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^app/migrations/versions/"]
